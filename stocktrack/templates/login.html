{% extends "base.html" %}
{% block title %}Iniciar sesión{% endblock %}
{% block auth %}
{% from "_macros.html" import csrf %}
<section class="auth-card">
  <img class="auth-logo" src="{{ url_for('static', filename='img/logo.svg') }}" alt="StockTrack · Control total de inventarios" width="320" height="80">
  <h1>Iniciar sesión</h1>
  <p class="muted">Accede con tu usuario de StockTrack.</p>
  <form method="post" action="{{ url_for('auth.login') }}" autocomplete="on">
    {{ csrf() }}
    {% if next_url %}<input type="hidden" name="next" value="{{ next_url }}">{% endif %}
    <label class="field"><span class="label">Usuario</span>
      <input name="username" value="{{ username }}" autocomplete="username" required autofocus></label>
    <label class="field"><span class="label">Contraseña</span>
      <input type="password" name="password" autocomplete="current-password" required></label>
    <button class="btn btn-primary btn-block" type="submit">Entrar</button>
  </form>
</section>
{% endblock %}
