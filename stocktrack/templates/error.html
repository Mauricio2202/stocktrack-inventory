{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block heading %}{{ title }}{% endblock %}
{% block content %}
<section class="card error-card">
  <p class="error-code">{{ code }}</p>
  <p>{{ message }}</p>
  <p><a class="btn" href="{{ url_for('dashboard.index') if g.user else url_for('auth.login') }}">Volver al inicio</a></p>
</section>
{% endblock %}
{% block auth %}
<section class="auth-card">
  <p class="error-code">{{ code }}</p>
  <h1>{{ title }}</h1>
  <p class="muted">{{ message }}</p>
  <p><a class="btn" href="{{ url_for('auth.login') }}">Ir a iniciar sesión</a></p>
</section>
{% endblock %}
